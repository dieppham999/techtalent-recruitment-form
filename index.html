<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Đăng ký ứng tuyển TechTalent</h1>
    </header>

    <main>
        <form action="https://bold-tiger-59.webhook.cool" method="POST">
            <fieldset>
                <legend>Thông tin cá nhân</legend>
                <label for="fullname">Họ và tên:</label><br>
                <input type="text" placeholder="Nhập tên" name="fullname" id="fullname" required><br>

                <label for="password">Mật khẩu hệ thống:</label><br>
                <input type="password" placeholder="Tạo mật khẩu" name="password" id="password" required><br>

                <label for="email">Email liên hệ:</label><br>
                <input type="email" placeholder="Tạo mật khẩu" name="email" id="email" required><br>

                <label>Giới tính:</label>
                
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Nam</label>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Nữ</label><br>

                <label for="birthday">Ngày sinh (dd/mm/yyyy):</label><br>
                <input type="date" name="birthday" id="birthday" required>
            </fieldset>

            <fieldset>
                <legend>Thông tin chuyên môn</legend>

                <label for="position">Vị trí ứng tuyển:</label><br>
                <select name="position" id="position">
                    <option value="">-- Chọn vị trí --</option>
                    <option value="frontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="fullstack">Fullstack Developer</option>
                    <option value="devops">DevOps Engineer</option>
                </select><br>
                
                <label for="cv">Nộp CV (Định dạng PDF):</label><br>
                <input type="file" placeholder="Nhập tên" name="cv" id="cv" accept=".pdf,application/pdf" required><br>
                
                <input type="submit" value="Gửi Hồ Sơ">
            </fieldset>
        </form>
    </main>
</body>
</html>
